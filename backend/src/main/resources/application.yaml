spring:
  application:
    name: dokdok
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hackathon}
    username: ${DATABASE_USERNAME:hackathon}
    password: ${DATABASE_PASSWORD:hackathon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
